<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P&amp;L và Dòng tiền</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --accent:#2a78d6; --accent-ink:#fff;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --good-ink:#006300; --warning:#fab219; --critical:#d03b3b;
  --warn-bg:#fff6e0; --crit-bg:#fdecec; --good-bg:#eaf6ea; --fc-bg:#eef4fc;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
    --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --accent:#3987e5; --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good-ink:#0ca30c; --critical:#e66767;
    --warn-bg:#3a2e10; --crit-bg:#3d1a1a; --good-bg:#16301a; --fc-bg:#17263a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
  --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --accent:#3987e5; --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-ink:#0ca30c; --critical:#e66767;
  --warn-bg:#3a2e10; --crit-bg:#3d1a1a; --good-bg:#16301a; --fc-bg:#17263a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:0 0 4px}
h3{font-size:14px;margin:0 0 10px;color:var(--ink-2);font-weight:600}
.sub{color:var(--ink-2);font-size:13px}
.hint{color:var(--muted);font-size:12px;margin:4px 0 12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.actions label{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px}
.btn{appearance:none;border:1px solid var(--border);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;font:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 8px}
input[type=number]{width:100%}
#drop{border:2px dashed var(--axis);border-radius:12px;padding:40px 16px;text-align:center;background:var(--surface);margin-bottom:16px}
body.over #drop,body.over .tabs{outline:2px dashed var(--accent)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--grid);margin-bottom:16px;overflow-x:auto}
.tab{border:0;background:none;color:var(--ink-2);padding:10px 14px;font:inherit;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.view{display:none}.view.active{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{margin:0}
.kpi .lbl{color:var(--ink-2);font-size:12px;text-transform:uppercase;letter-spacing:.03em}
.kpi .val{font-size:24px;font-weight:650;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .note{color:var(--muted);font-size:12px}
.kpi.plan{background:var(--fc-bg)}
.kpi.alert{border-left:4px solid var(--critical)}
.up{color:var(--good-ink)}.down{color:var(--critical)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:960px){.grid2{grid-template-columns:1fr}}
.insights{margin:0;padding-left:18px}.insights li{margin:6px 0}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:4px 0 8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend i.ln{height:2px;width:14px;vertical-align:3px;border-radius:0}
.legend i.fc{background:var(--fc-bg);border:1px solid var(--axis)}
.chart{position:relative;width:100%;min-height:280px}
.chart svg{display:block;width:100%;height:280px;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.tip{position:fixed;pointer-events:none;background:var(--surface);border:1px solid var(--border);box-shadow:0 4px 16px rgba(0,0,0,.15);border-radius:8px;padding:8px 10px;font-size:12px;z-index:50;display:none;min-width:170px}
.tip b{display:block;margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
/* assumptions */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 16px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2)}
.form label small{color:var(--muted)}
details.card>summary{cursor:pointer;font-weight:600;list-style:none}
details.card>summary::before{content:"▸ ";color:var(--muted)}
details.card[open]>summary::before{content:"▾ "}
details.card[open]>summary{margin-bottom:12px}
/* tables */
.tblwrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface);max-height:75vh}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--grid);text-align:left;white-space:nowrap}
th{background:var(--surface-2);color:var(--ink-2);font-weight:600;position:sticky;top:0;z-index:2}
td.lbl,th.lbl{position:sticky;left:0;background:var(--surface);z-index:1;min-width:250px;max-width:340px;white-space:normal}
th.lbl{background:var(--surface-2);z-index:3}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
th.fc{background:var(--fc-bg);color:var(--ink)}
td.fc{background:var(--fc-bg)}
th.tc,td.tc{font-weight:650;border-left:1px solid var(--axis)}
tr.tot td{font-weight:650;background:var(--surface-2)}
tr.tot td.fc{background:var(--fc-bg)}
tr.grand td{font-weight:700;border-top:2px solid var(--axis);background:var(--surface-2)}
tr.pct td{color:var(--muted);font-style:italic;font-size:12px}
tr.memo td{color:var(--ink-2);font-size:12px}
tr.subrow td.lbl{padding-left:30px;color:var(--ink-2)}
tr.subrow td{font-size:12px;color:var(--ink-2)}
tr.hide{display:none}
tr.grp td{font-weight:650;color:var(--ink);background:var(--surface)}
.tg{display:inline-block;width:16px;color:var(--muted);cursor:pointer}
tr[data-id] td.lbl{cursor:pointer}
td.neg{color:var(--critical)}
td.dd{cursor:pointer}td.dd:hover{text-decoration:underline;color:var(--accent)}
td.ed{cursor:text}td.ed:hover{outline:1px dashed var(--accent);outline-offset:-2px}
td.ovr{background:var(--warn-bg)!important;font-weight:600}
td.low{background:var(--crit-bg)!important;color:var(--critical);font-weight:650}
td input.cell{width:110px;text-align:right;padding:2px 4px}
.map td select{padding:3px 6px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;background:var(--surface-2);color:var(--ink-2)}
.badge.fcb{background:var(--fc-bg);color:var(--accent)}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal[hidden]{display:none}
.mbox{background:var(--surface);border-radius:12px;max-width:1100px;width:100%;max-height:88vh;display:flex;flex-direction:column;border:1px solid var(--border)}
.mbox header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--grid)}
.mbox .body{overflow:auto;padding:0}
.mbox table td{white-space:normal}
.mbox table td.n{white-space:nowrap}
@media (max-width:560px){td.lbl,th.lbl{min-width:170px}.kpi .val{font-size:20px}}
</style>
</head>

function blank(){return {rev:0,ded:0,cogs:0,fi:0,fe:0,sell:0,ga:0,oi:0,oe:0,cit:0,da:0,alloc:0,sub:{}}}

  for(const r of D.recs){
    if(r.du.startsWith('911')) continue;

      const v=s<0?r.c-r.n:r.n-r.c, o=out[r.ym]; o[k]+=v; o.sub[r.tk]=(o.sub[r.tk]||0)+v;

  const revAll=sum(actYms,y=>act[y].rev);
  let vatOut=0,ar=0,ap=0;
  for(const r of D.recs){ if(r.ym>last) continue;
    if(r.tk.startsWith('3331')) vatOut+=r.c;
    if(r.tk.startsWith('131')) ar+=r.n-r.c;
    if(r.tk.startsWith('331')) ap+=r.c-r.n; }
  auto.vat=revAll?vatOut/revAll*100:10; auto.arOpen=Math.max(0,ar); auto.apOpen=Math.max(0,ap);
  const val=(k)=>{const a=A(k);return a===null?auto[k]:+a};

  /* P&L plan */
  const planYms=[]; for(let ym=nextYm(last);ym<=(year+1)*100+12;ym=nextYm(ym)) planYms.push(ym);
  const revBase=A('revBase')==='last'?act[last].net:bNet/N;
  const gm=val('gm')/100, sp=val('sellPct')/100, ga0=val('ga'), fi0=val('fi'), fe0=val('fe'), oth0=+A('oth')||0, citR=(+A('cit')||0)/100, gaInf=(+A('gaInf')||0)/100;
  const plan={}; let r=revBase;
  for(const ym of planYms){const g=(ymY(ym)===year?+A('g1'):+A('g2'))/100; r=r*(1+g); const o=ov('pl','rev',ym); if(o!=null) r=o; plan[ym]=Object.assign(blank(),{rev:r,_ovr:o!=null});}

  return `M${x},${y0}V${y1+d*r}Q${x},${y1} ${x+r},${y1}H${x+w-r}Q${x+w},${y1} ${x+w},${y1+d*r}V${y0}Z`}
const axisFmt=v=>{const a=Math.abs(v);return a>=1e9?(v/1e9).toLocaleString('vi-VN',{maximumFractionDigits:1})+' tỷ':a>=1e6?(v/1e6).toLocaleString('vi-VN',{maximumFractionDigits:0})+' tr':String(v)};
function drawChart(id,cfg){
  CHARTS[id]=cfg; const el=document.getElementById(id); if(!el||!el.offsetParent) return;
  const {labels,bars,line,split,threshold}=cfg, n=labels.length; if(!n){el.innerHTML='';return}
  const W=Math.max(el.clientWidth,320),H=280,m={l:58,r:10,t:16,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b;
  const vals=[0];bars.forEach(b=>vals.push(...b.v));if(line) vals.push(...line.v);if(threshold!=null) vals.push(threshold);
  const tk=niceTicks(Math.min(...vals),Math.max(...vals),5),lo=tk[0],hi=tk[tk.length-1];
  const y=v=>m.t+ih-(v-lo)/(hi-lo)*ih, step=iw/n, x0=i=>m.l+i*step;
  const gw=Math.min(step*0.72,64), bw=Math.max(2,(gw-(bars.length-1)*2)/bars.length);
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">`;
  if(split!=null&&split<n) s+=`<rect x="${x0(split)}" y="${m.t-6}" width="${W-m.r-x0(split)}" height="${ih+6}" style="fill:var(--fc-bg)"/><text x="${x0(split)+6}" y="${m.t+6}" style="fill:var(--accent);font-weight:600">Kế hoạch / dự báo →</text>`;
  tk.forEach(t=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(t)}" y2="${y(t)}" style="stroke:${t===0?'var(--axis)':'var(--grid)'};stroke-width:1"/><text x="${m.l-6}" y="${y(t)+4}" text-anchor="end">${axisFmt(t)}</text>`});
  if(threshold!=null) s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(threshold)}" y2="${y(threshold)}" style="stroke:var(--critical);stroke-dasharray:5 4;stroke-width:1.5"/><text x="${W-m.r}" y="${y(threshold)-5}" text-anchor="end" style="fill:var(--critical)">Ngưỡng tối thiểu ${axisFmt(threshold)}</text>`;
  const every=Math.ceil(n*40/iw);
  labels.forEach((l,i)=>{
    bars.forEach((b,j)=>{const xb=x0(i)+(step-gw)/2+j*(bw+2);s+=`<path d="${barPath(xb,y(0),bw,y(b.v[i]),4)}" style="fill:var(--${b.c});opacity:${split!=null&&i>=split?0.55:1}"/>`});
    if(i%every===0) s+=`<text x="${x0(i)+step/2}" y="${H-8}" text-anchor="middle">${l}</text>`;
  });
  if(line){const pts=line.v.map((v,i)=>[x0(i)+step/2,y(v)]),cut=split==null?n:split;
    const seg=(a,b)=>pts.slice(a,b).map((p,i)=>(i?'L':'M')+p[0]+','+p[1]).join('');
    s+=`<path d="${seg(0,cut)}" style="fill:none;stroke:var(--${line.c});stroke-width:2"/>`;
    if(cut<n) s+=`<path d="${seg(Math.max(0,cut-1),n)}" style="fill:none;stroke:var(--${line.c});stroke-width:2;stroke-dasharray:6 4"/>`;
    pts.forEach(p=>{s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" style="fill:var(--${line.c});stroke:var(--surface);stroke-width:2"/>`});}
  s+=`<line id="${id}-guide" x1="0" x2="0" y1="${m.t}" y2="${m.t+ih}" style="stroke:var(--axis);display:none"/>`;
  labels.forEach((l,i)=>{s+=`<rect class="hit" data-i="${i}" x="${x0(i)}" y="${m.t}" width="${step}" height="${ih}" style="fill:transparent"/>`});
  s+='</svg>';
  el.innerHTML=s;
  const tip=$('#tip'), guide=document.getElementById(id+'-guide');
  el.querySelectorAll('.hit').forEach(h=>{
    h.addEventListener('mousemove',e=>{const i=+h.dataset.i;
      let t=`<b>${labels[i]}${split!=null&&i>=split?' · <span class="badge fcb">KH</span>':''}</b>`;
      bars.forEach(b=>t+=`<div class="r"><span><i style="background:var(--${b.c})"></i>${b.n}</span><span>${fmtS(b.v[i])}</span></div>`);
      if(line) t+=`<div class="r"><span><i style="background:var(--${line.c})"></i>${line.n}</span><span>${fmtS(line.v[i])}</span></div>`;
      tip.innerHTML=t;tip.style.display='block';
      const tx=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=tx+'px';tip.style.top=(e.clientY+14)+'px';
      const gx=x0(i)+step/2;guide.setAttribute('x1',gx);guide.setAttribute('x2',gx);guide.style.display='';});
    h.addEventListener('mouseleave',()=>{tip.style.display='none';guide.style.display='none'});
  });
}

    <label>Số dư tiền đầu kỳ 01/01 (TK 111+112, triệu đ)<input type="number" step="any" id="opening" value="${+S.opening?+S.opening/1e6:''}" placeholder="0"></label>
    <label>Tháng thực tế cuối cùng (sau tháng này là kế hoạch)<select id="lastActual">${D.yms.map(y=>`<option value="${y}"${y===S.lastActual?' selected':''}>${ymLabel(y)}</option>`).join('')}</select></label>
   </div><div class="hint">File Nhật ký chung không chứa số dư đầu kỳ — hãy nhập số dư tiền tại 01/01 để có số dư cuối kỳ đúng. Nếu tháng cuối chưa khóa sổ, chọn tháng trước đó làm tháng thực tế cuối.</div></div>
   <div class="card"><h2>Phân loại dòng tiền theo TK đối ứng</h2><div class="hint">Đơn vị: ${unitName()}. Mỗi bút toán Nợ/Có TK 111, 112 được xếp vào nhóm theo TK đối ứng. Đổi phân loại nếu cần (ví dụ thanh toán mua TSCĐ qua 331).</div>
   <div class="tblwrap map"><table><thead><tr><th>TK đối ứng</th><th>Tên tài khoản</th><th class="n">Tiền vào</th><th class="n">Tiền ra</th><th class="n">Số dòng</th><th>Phân loại</th></tr></thead><tbody>${rows}</tbody></table></div>
   <div class="actions" style="margin-top:12px"><button class="btn" id="resetMap">Khôi phục phân loại mặc định</button></div></div>`;
}
function renderAll(){
  if(!D){$('#drop').hidden=false;return}
  $('#drop').hidden=true; $('#unit').value=String(S.unit);
  M=model();
  renderOverview();renderPL();renderPlan();renderCF();renderCFF();renderSet();
  setTab(S.tab);
}
function setTab(t){
  S.tab=t; save();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='v-'+t));
  for(const [id,cfg] of Object.entries(CHARTS)) drawChart(id,cfg);
}

/* ---------- drill-down ---------- */
function drill(spec){
  const [t,a,ymS,tk]=spec.split('|'), ym=+ymS||0; let list,title;
  if(t==='pl'){const d=PL_ACC.find(x=>x[0]===a),p=tk||d[1];
    list=D.recs.filter(r=>r.tk.startsWith(p)&&!r.du.startsWith('911')&&(ym?r.ym===ym:r.ym<=M.last)).map(r=>({...r,v:d[2]<0?r.c-r.n:r.n-r.c}));
    title=`${tk?tk+' – '+accName(tk):PL_ROWS.find(x=>x.k===a).l}`;}
  else{list=D.recs.filter(r=>isCash(r.tk)&&catOf(r.du)===a&&(ym?r.ym===ym:r.ym<=M.last)).map(r=>({...r,v:r.n-r.c}));title=CF_CAT[a].l;}
  list=list.filter(r=>r.v);
  const tot=sum(list,r=>r.v), shown=list.slice(0,1500);
  $('#mtitle').textContent=title;
  $('#msub').textContent=`${ym?ymLabel(ym):'Lũy kế'} · ${list.length} dòng · Tổng ${fmtS(tot)}${list.length>shown.length?' · hiển thị 1.500 dòng đầu':''}`;
  $('#mbody').innerHTML=`<table><thead><tr><th>Ngày</th><th>Số CT</th><th>Diễn giải</th><th>TK</th><th>TK đối ứng</th><th class="n">Số tiền (đ)</th></tr></thead><tbody>${shown.map(r=>`<tr><td>${r.ds}</td><td>${esc(r.so)}</td><td>${esc(r.dg)}</td><td>${esc(r.tk)}</td><td title="${esc(accName(r.du))}">${esc(r.du)}</td><td class="n${r.v<0?' neg':''}">${Math.round(r.v).toLocaleString('vi-VN')}</td></tr>`).join('')}</tbody></table>`;
  $('#modal').hidden=false;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tab=e.target.closest('.tab'); if(tab){setTab(tab.dataset.tab);return}
  const dd=e.target.closest('td.dd'); if(dd){drill(dd.dataset.dd);return}
  const ed=e.target.closest('td.ed'); if(ed&&!ed.querySelector('input')){editCell(ed);return}
  const tr=e.target.closest('tr[data-id]'); if(tr&&e.target.closest('td.lbl')){const id=tr.dataset.id;OPEN.has(id)?OPEN.delete(id):OPEN.add(id);
    tr.querySelector('.tg').textContent=OPEN.has(id)?'▾':'▸';document.querySelectorAll(`tr[data-parent="${id}"]`).forEach(x=>x.classList.toggle('hide',!OPEN.has(id)));return}
  const rs=e.target.closest('[data-reset]'); if(rs){const keys=rs.dataset.reset==='pl'?['revBase','baseN','g1','g2','target27','gm','sellPct','ga','gaInf','fi','fe','oth','cit']:['vat','colNow','arOpen','arM','payNow','apOpen','apM','capex26','capex27','eq27','debt27','minCash'];keys.forEach(k=>delete S.A[k]);save();renderAll();return}
  const co=e.target.closest('[data-clearov]'); if(co){const p=co.dataset.clearov+'|';Object.keys(S.OV).forEach(k=>{if(k.startsWith(p)) delete S.OV[k]});save();renderAll();return}
  if(e.target.id==='resetMap'){S.MAP={};save();renderAll();return}
  if(e.target.id==='mclose'||e.target.id==='modal') $('#modal').hidden=true;
});
document.addEventListener('keydown',e=>{if(e.key==='Escape') $('#modal').hidden=true});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.a){const k=el.dataset.a;let v=el.value;
    if(v===''){delete S.A[k]} else S.A[k]=el.tagName==='SELECT'?v:(el.dataset.m==='1'?+v*1e6:+v);
    save();renderAll();return}
  if(el.dataset.map){const d=defCat(el.dataset.map);if(el.value===d) delete S.MAP[el.dataset.map]; else S.MAP[el.dataset.map]=el.value;save();renderAll();return}
  if(el.id==='opening'){S.opening=el.value===''?0:+el.value*1e6;save();renderAll();return}
  if(el.id==='lastActual'){S.lastActual=+el.value;save();renderAll();return}
  if(el.id==='unit'){S.unit=+el.value;save();renderAll();return}
  if(el.id==='file'&&el.files[0]) loadFile(el.files[0]);
});
function editCell(td){
  const key=td.dataset.ov, [t,k,ym]=key.split('|');
  const cur=t==='pl'?M.plan[+ym][k]:M.cff[+ym][k];
  const inp=document.createElement('input');inp.className='cell';inp.type='text';
  inp.value=String(Math.round(cur/S.unit*10)/10);td.textContent='';td.appendChild(inp);inp.focus();inp.select();
  let done=false;
  const commit=ok=>{if(done) return;done=true;
    if(ok){const s=inp.value.trim();if(s==='') delete S.OV[key]; else {const v=num(s);if(isFinite(v)) S.OV[key]=v*S.unit;} save();}
    renderAll();};
  inp.addEventListener('keydown',e=>{if(e.key==='Enter') commit(true); if(e.key==='Escape') commit(false)});
  inp.addEventListener('blur',()=>commit(true));
}
function loadFile(f){
  const rd=new FileReader();
  rd.onload=()=>{try{parseWorkbook(XLSX.read(new Uint8Array(rd.result),{type:'array'}),f.name)}catch(err){alert('Lỗi đọc file: '+err.message)}};
  rd.readAsArrayBuffer(f);
}
addEventListener('dragover',e=>{e.preventDefault();document.body.classList.add('over')});
addEventListener('dragleave',e=>{if(!e.relatedTarget) document.body.classList.remove('over')});
addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('over');const f=e.dataTransfer.files[0];if(f) loadFile(f)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{for(const [id,cfg] of Object.entries(CHARTS)) drawChart(id,cfg)},150)});

/* ---------- export ---------- */
$('#exportBtn').addEventListener('click',()=>{
  if(!D) return;
  const wb=XLSX.utils.book_new(), add=(name,g)=>{const aoa=gridAoa(g);const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:48},...g.cols.map(()=>({wch:16}))];XLSX.utils.book_append_sheet(wb,ws,name)};
  add('P&L thuc te',gridPL());
  add('Ke hoach P&L',gridPlan());
  add('Dong tien thuc te',gridCF());
  add('Du bao dong tien',gridCFF());
  const as=[['Giả định','Giá trị'],...Object.keys(DEF_A).map(k=>[k,A(k)===null?'tự động: '+(M.auto[k]??''):A(k)]),['Số dư tiền đầu kỳ',+S.opening||0],['Tháng thực tế cuối',ymLabel(M.last)]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(as),'Gia dinh');
  XLSX.writeFile(wb,`PL_DongTien_${ymLabel(M.last).replace('/','-')}.xlsx`);
});

/* ---------- start ---------- */
if(SAMPLE) fromSample(SAMPLE); else renderAll();
</script>
</body>
</html>
